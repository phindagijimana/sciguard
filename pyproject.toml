[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sciguard"
version = "0.1.0"
description = "Read-only preflight checker for neuroimaging workflow edges."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6",
  "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sciguard = "validation.cli:main"

[tool.setuptools]
packages = [
  "validation",
  "baselines",
  "sciguard",
  "sciguard_data",
  "sciguard_data.schema",
  "sciguard_data.contracts",
  "sciguard_data.rules",
]

[tool.setuptools.package-dir]
"sciguard_data.schema" = "schema"
"sciguard_data.contracts" = "contracts"
"sciguard_data.rules" = "rules"

[tool.setuptools.package-data]
"sciguard_data.schema" = ["*.json", "*.yaml"]
"sciguard_data.contracts" = ["*.yaml"]
"sciguard_data.rules" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
